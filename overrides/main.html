{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <style>
    html[data-md-color-scheme="default"],
    html[data-md-color-scheme="slate"] {
      background: #EFF3F9;
      color-scheme: light;
    }
  </style>
  <script>
    (function () {
      var forced = { scheme: "default", primary: "custom", accent: "custom" };
      var applyColor = function (target) {
        if (!target) {
          return;
        }

        target.setAttribute("data-md-color-scheme", forced.scheme);
        target.setAttribute("data-md-color-primary", forced.primary);
        target.setAttribute("data-md-color-accent", forced.accent);
      };
      var syncHtml = function () {
        applyColor(document.documentElement);
        document.documentElement.style.background = "var(--mesh-bg, #EFF3F9)";
        document.documentElement.style.colorScheme = "light";
      };

      syncHtml();

      document.addEventListener("DOMContentLoaded", function () {
        applyColor(document.body);
        syncHtml();

        new MutationObserver(function () {
          applyColor(document.body);
          syncHtml();
        }).observe(document.body, {
          attributes: true,
          attributeFilter: [
            "data-md-color-scheme",
            "data-md-color-primary",
            "data-md-color-accent"
          ]
        });
      });
    })();
  </script>
{% endblock %}
